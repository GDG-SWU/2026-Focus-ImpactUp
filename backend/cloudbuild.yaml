steps:
  - name: 'gradle:8-jdk21'
    args: ['gradle', 'clean', 'bootJar']

  # Dockerfile을 읽어서 도커 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/focus-repo/focus-backend:latest'
      - '.'

  # Artifact Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/focus-repo/focus-backend:latest'

  # Cloud Run에 모든 보안 비밀을 결합하여 배포
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'focus-service'
      - '--image'
      - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/focus-repo/focus-backend:latest'
      - '--region'
      - 'asia-northeast3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

      # 파이어베이스 키 파일 가상 경로 설정
      - '--set-env-vars'
      - 'FIREBASE_CREDENTIALS_PATH=/secrets/firebase-key.json'

      # 모든 금고 연결
      - '--set-secrets'
      - 'DB_HOST=DB_HOST:latest,DB_PORT=DB_PORT:latest,DB_NAME=DB_NAME:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,FIREBASE_BUCKET_NAME=FIREBASE_BUCKET_NAME:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GEMINI_BASE_URL=GEMINI_BASE_URL:latest,GEMINI_MODEL=GEMINI_MODEL:latest,/secrets/firebase-key.json=focus-firebase-json:latest'

options:
  logging: CLOUD_LOGGING_ONLY