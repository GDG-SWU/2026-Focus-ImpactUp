openapi: 3.0.3
info:
  description: |
    재난 상황에서 취약계층(외국인, 아동 동반, 기저질환자 등)을 위한 긴급 지원 앱의 백엔드 API입니다.

    ## 공통 규격
    - **Base URL**: `https://api.{service-domain}/api/v1`
    - **인증**: JWT Bearer Token (`Authorization: Bearer {token}`)
    - **언어 헤더**: `Accept-Language: ar | fr | wo | ff | ha`
    - **오프라인 전략**: 로컬 SQLite 캐시 우선 → 온라인 복귀 시 동기화
    - **오프라인 응답**: `X-Offline-Cache: true` 헤더 포함
    - **Content-Type**: `application/json` (파일 업로드 제외)

    ## 에러 코드 목록

    | 코드 | HTTP 상태 | 설명 |
    |------|-----------|------|
    | `AUTH_TOKEN_MISSING` | 401 | Authorization 헤더 없음 |
    | `AUTH_TOKEN_EXPIRED` | 401 | JWT 토큰 만료 |
    | `AUTH_TOKEN_INVALID` | 401 | JWT 토큰 형식 오류 |
    | `FORBIDDEN` | 403 | 해당 리소스에 접근 권한 없음 |
    | `USER_NOT_FOUND` | 404 | 존재하지 않는 사용자 |
    | `PROFILE_NOT_FOUND` | 404 | 건강 프로필 미등록 상태 |
    | `FACILITY_NOT_FOUND` | 404 | 존재하지 않는 기관 ID |
    | `CARD_NOT_FOUND` | 404 | 해당 번역 카드 없음 |
    | `VALIDATION_ERROR` | 422 | 요청 Body 유효성 검사 실패 |
    | `LOCATION_UNAVAILABLE` | 503 | GPS 신호 유실 및 추측 항법 데이터 부족 |
    | `TTS_UNAVAILABLE` | 503 | TTS 서비스(Google TTS 등) 응답 불가 |
    | `OCR_PROCESSING_FAILED` | 500 | ML Kit OCR 처리 실패 |
    | `OFFLINE_CACHE_STALE` | 200 | 오프라인 캐시 반환 (데이터 최신 아닐 수 있음) |
    | `UNSUPPORTED_LANGUAGE` | 400 | 지원하지 않는 언어 코드 |
    | `FILE_TOO_LARGE` | 413 | 업로드 파일 10MB 초과 |
    | `INVALID_IMAGE_FORMAT` | 415 | 지원하지 않는 이미지 형식 |
    | `INTERNAL_SERVER_ERROR` | 500 | 서버 내부 오류 |
  title: QOS API
  version: 1.0.0
servers:
- description: Local
  url: http://localhost:8080/api/v1
- description: Production
  url: https://api.example.com/api/v1
- description: Staging
  url: https://staging-api.example.com/api/v1
security:
- BearerAuth: []
tags:
- description: 사용자 온보딩 및 프로필 관리
  name: Profile
- description: 홈 화면 상태 및 생존 가이드
  name: Status
- description: 위치 기반 지도 및 기관 탐색
  name: Map
- description: 번역 카드 및 TTS
  name: Translation
- description: 스마트 세이프티 OCR
  name: OCR
paths:
  /users/onboard:
    post:
      description: 앱 최초 실행 시 디바이스 언어 감지 및 사용자 선택 언어 등록. JWT 발급.
      requestBody:
        content:
          application/json:
            example:
              locale: ar-SD
              preferred_language: ar
            schema:
              $ref: '#/components/schemas/OnboardRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardResponse'
          description: "온보딩 완료, JWT 발급"
        "400":
          content:
            application/json:
              examples:
                unsupported_language:
                  value:
                    code: UNSUPPORTED_LANGUAGE
                    message: 지원하지 않는 언어 코드입니다.
                    offline: false
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: 요청 데이터가 올바르지 않습니다.
                    offline: false
                    details:
                      preferred_language: "ar, fr, wo, ff, ha 중 하나여야 합니다."
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 유효성 검사 실패 또는 지원하지 않는 언어
      summary: 초기 언어 설정 (온보딩)
      tags:
      - Profile
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/profile:
    get:
      description: "언어, 기저질환, 알레르기, 동반자 여부 전체 조회."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: 프로필 조회 성공
          headers:
            X-Offline-Cache:
              explode: false
              schema:
                type: boolean
              style: simple
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
        "404":
          content:
            application/json:
              example:
                code: USER_NOT_FOUND
                message: 존재하지 않는 사용자입니다.
                offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 사용자 없음
      security:
      - BearerAuth: []
      summary: 프로필 전체 조회
      tags:
      - Profile
      x-accepts:
      - application/json
  /users/profile/health:
    post:
      description: |
        기저질환(당뇨·고혈압 등), 알레르기(페니실린 등) 정보 등록.
        입력값은 OCR 위험 감지 판단 로직과 연계됨.
        오프라인 시 로컬 SQLite 저장.
      requestBody:
        content:
          application/json:
            example:
              conditions:
              - diabetes
              - hypertension
              allergies:
              - penicillin
              medications:
              - metformin
              - lisinopril
            schema:
              $ref: '#/components/schemas/HealthProfileRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfileResponse'
          description: 건강 프로필 등록 성공
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
        "422":
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: 요청 데이터가 올바르지 않습니다.
                offline: false
                details:
                  lat: 유효한 위도 값이 필요합니다 (-90 ~ 90).
                  lng: 유효한 경도 값이 필요합니다 (-180 ~ 180).
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 요청 Body 유효성 검사 실패
      security:
      - BearerAuth: []
      summary: 건강 프로필 등록
      tags:
      - Profile
      x-content-type: application/json
      x-accepts:
      - application/json
    put:
      description: 기저질환·알레르기·복용 약물 수정.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthProfileRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfileResponse'
          description: 수정 성공
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
        "404":
          content:
            application/json:
              example:
                code: PROFILE_NOT_FOUND
                message: 건강 프로필이 등록되지 않았습니다. 먼저 POST로 등록하세요.
                offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 건강 프로필 미등록
      security:
      - BearerAuth: []
      summary: 건강 프로필 수정
      tags:
      - Profile
      x-content-type: application/json
      x-accepts:
      - application/json
  /users/profile/companions:
    post:
      description: |
        아동·암산부 등 동반 가족 유형 등록.
        추후 쉼터 필터링 시 '가족/여성 전용' 우선 안내에 활용.
      requestBody:
        content:
          application/json:
            example:
              companion_types:
              - child
              - pregnant
            schema:
              $ref: '#/components/schemas/CompanionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanionResponse'
          description: 동반자 등록 성공
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
        "422":
          content:
            application/json:
              example:
                code: VALIDATION_ERROR
                message: 요청 데이터가 올바르지 않습니다.
                offline: false
                details:
                  lat: 유효한 위도 값이 필요합니다 (-90 ~ 90).
                  lng: 유효한 경도 값이 필요합니다 (-180 ~ 180).
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 요청 Body 유효성 검사 실패
      security:
      - BearerAuth: []
      summary: 동반자 등록
      tags:
      - Profile
      x-content-type: application/json
      x-accepts:
      - application/json
  /status/network:
    get:
      description: |
        온라인/오프라인 연결 상태 및 마지막으로 확인된 위치 정보 반환.
        오프라인에서도 항상 표시 (로컬 캐시 기반).
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkStatusResponse'
          description: 상태 조회 성공
          headers:
            X-Offline-Cache:
              explode: false
              schema:
                type: boolean
              style: simple
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
      security:
      - BearerAuth: []
      summary: 네트워크 상태 배너 조회
      tags:
      - Status
      x-accepts:
      - application/json
  /guide/survival-actions:
    get:
      description: |
        현재 생존 단계 기반 다음 할 일 안내.
        로컬 캐시 기반 제안 표시 (오프라인 동작).
      parameters:
      - description: 현재 생존 단계 (미입력 시 서버에서 자동 판단)
        explode: true
        in: query
        name: stage
        required: false
        schema:
          enum:
          - dehydration_risk
          - find_water
          - find_food
          - find_shelter
          - move_to_facility
          - stable
          type: string
        style: form
      - example: 15.5517
        explode: true
        in: query
        name: location_lat
        required: false
        schema:
          format: double
          type: number
        style: form
      - example: 32.5324
        explode: true
        in: query
        name: location_lng
        required: false
        schema:
          format: double
          type: number
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurvivalActionsResponse'
          description: 생존 행동 제안 반환
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
      security:
      - BearerAuth: []
      summary: 생존 행동 제안 조회
      tags:
      - Status
      x-accepts:
      - application/json
  /home/quick-categories:
    get:
      description: 의료·음식·식수·쉼터 4가지 핵심 카테고리 아이콘 및 탭 지도 딥링크 반환.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCategoriesResponse'
          description: 카테고리 목록 반환
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
      security:
      - BearerAuth: []
      summary: 긴급 퀵 버튼 카테고리 조회
      tags:
      - Status
      x-accepts:
      - application/json
  /map/tiles:
    get:
      description: |
        Mapbox 카나리아 지역 벡터 타일 URL 템플릿 및 주요 기관 위치 GeoJSON 반환.
        앱 설치 시 사전 다운로드 기반 오프라인 타일.
      parameters:
      - description: "Bounding box (minLng,minLat,maxLng,maxLat)"
        example: "32.4,15.4,32.7,15.7"
        explode: true
        in: query
        name: bbox
        required: false
        schema:
          type: string
        style: form
      - example: 14
        explode: true
        in: query
        name: zoom
        required: false
        schema:
          maximum: 18
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapTilesResponse'
          description: 지도 타일 정보 반환
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
      security:
      - BearerAuth: []
      summary: 오프라인 지도 타일 조회
      tags:
      - Map
      x-accepts:
      - application/json
  /location/current:
    get:
      description: GPS 신호 기반 현재 위치 반환. 오프라인 시 파란 점 렌더링용 캐시 반환.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentLocationResponse'
          description: 위치 정보 반환
        "401":
          content:
            application/json:
              examples:
                token_missing:
                  summary: 토큰 없음
                  value:
                    code: AUTH_TOKEN_MISSING
                    message: Authorization 헤더가 없습니다.
                    offline: false
                token_expired:
                  summary: 토큰 만료
                  value:
                    code: AUTH_TOKEN_EXPIRED
                    message: JWT 토큰이 만료되었습니다. 다시 로그인해주세요.
                    offline: false
                token_invalid:
                  summary: 토큰 형식 오류
                  value:
                    code: AUTH_TOKEN_INVALID
                    message: JWT 토큰 형식이 올바르지 않습니다.
                    offline: false
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 인증 실패
        "503":
          content:
            application/json:
              example:
                code: LOCATION_UNAVAILABLE
